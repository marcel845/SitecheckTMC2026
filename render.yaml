services:
  - type: web
    name: sitecheck
    runtime: docker
    plan: free
    healthCheckPath: /list
    envVars:
      - key: SITECHECK_PASSWORD
        sync: false   # wordt bij deploy gevraagd: kies een wachtwoord voor de web-interface
      - key: SITECHECK_REPORTS
        value: /data/rapporten
